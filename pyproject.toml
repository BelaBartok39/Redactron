[project]
name = "redactron"
version = "0.1.0"
description = "Local GPU-accelerated QA tool for verifying redaction completeness in legal documents"
requires-python = ">=3.11"
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "paddleocr>=2.7",
    "paddlepaddle>=2.5",
    "PyMuPDF>=1.23",
    "streamlit>=1.30",
    "pydantic>=2.5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
gpu = [
    "paddlepaddle-gpu>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redactron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
